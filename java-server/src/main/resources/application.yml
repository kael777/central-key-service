server:
  port: ${PORT:8443}
  ssl:
    enabled: true
    certificate: ${TLS_CERT:file:../go-key-sdk/certs/server.crt}
    certificate-private-key: ${TLS_KEY:file:../go-key-sdk/certs/server.key}
    trust-certificate: ${TLS_CA:file:../go-key-sdk/certs/ca.crt}
    client-auth: want
  error:
    include-message: always

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/cms_key_java?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  main:
    banner-mode: off

app:
  admin-token: ${ADMIN_TOKEN:dev-token}
  kek: ${KEY_KEK:}
  grace-seconds: ${GRACE_SECONDS:300}
  prepublish-seconds: ${PREPUBLISH_SECONDS:600}
  rotation-seconds: ${ROTATION_SECONDS:3600}
  trusted-proxies: ${TRUSTED_PROXIES:}
  proxy-secret: ${PROXY_SECRET:}

logging:
  level:
    root: INFO
    com.example.keyserver: INFO
