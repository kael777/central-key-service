# /etc/nginx/snippets/central-key-headers.conf
#
# 由 central-key.conf 引入。重點：把 mTLS 結果轉成後端可信任的標頭，
# 後端必須設定相同的 proxy_secret 才會採信。

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# 用戶端憑證資訊（Nginx 已驗證）
proxy_set_header X-Client-CN     $ssl_client_s_dn_cn;
proxy_set_header X-Client-Verify $ssl_client_verify;

# 共享密鑰：必須與後端 -proxy-secret 相同，否則後端不採信上面的身分
proxy_set_header X-Proxy-Secret  "REPLACE_WITH_SECRET";

# 不要讓外部 Authorization 傳進後端
proxy_set_header Authorization "";

proxy_connect_timeout 5s;
proxy_send_timeout    15s;
proxy_read_timeout    15s;
