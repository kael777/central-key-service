# 方案 B：TCP 透傳（不改後端、不做 TLS 終結）
#
# 適用：不想讓 Nginx 碰憑證內容，或 Nginx 版本太舊沒有 $ssl_client_s_dn_cn。
# 代價：Nginx 看不到 HTTP，無法做路徑級限流／網段限制，
#       這些就必須靠後端的 admin_cidr 與網路防火牆。

stream {
    upstream central_key_tls {
        server 127.0.0.1:8443;
    }

    server {
        listen 9443;
        proxy_pass central_key_tls;
        proxy_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
