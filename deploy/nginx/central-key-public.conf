# /etc/nginx/conf.d/central-key-public.conf
#
# 公網部署版本：A／B 機器在外網，透過 443 連進來。
#
# 與內網版的差異：
#   1. 伺服器憑證改用「公開 CA」（Let's Encrypt 等），用戶端才不用手動信任自簽 CA
#   2. 用戶端憑證仍由自己的內網 CA 簽發（ssl_client_certificate）
#   3. 後台完全不放公網：/admin、/login 一律拒絕，管理走 VPN 或內網入口
#   4. 加上 CRL（憑證吊銷）與連線數限制
#
# 後端啟動參數：
#   -addr 127.0.0.1:8443 -trusted-proxy 127.0.0.1/32 -proxy-secret <密鑰>
#   -admin-cidr <維運網段>   # 這一層仍然有效，作為第二道

upstream central_key_backend {
    server 127.0.0.1:8443;
    keepalive 32;
}

limit_req_zone  $binary_remote_addr zone=key_api:10m  rate=20r/s;
limit_conn_zone $binary_remote_addr zone=key_conn:10m;

server {
    listen 443 ssl;
    http2 on;
    server_name key.example.com;          # 必須是公開 DNS 可解析的名稱

    # 公開 CA 簽發的伺服器憑證
    ssl_certificate     /etc/letsencrypt/live/key.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/key.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/key.example.com/chain.pem;
    ssl_stapling on;
    ssl_stapling_verify on;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # 用戶端憑證：自己的內網 CA
    ssl_client_certificate /etc/nginx/tls/client-ca.crt;
    # optional：健康檢查（本機）不需憑證；系統 API 在 location 內強制要求
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    # 憑證吊銷清單（機器遺失或被入侵時使用）
    # ssl_crl /etc/nginx/tls/client-ca.crl;

    server_tokens off;
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    limit_conn key_conn 20;

    # 公網不提供後台：管理請走 VPN／內網
    location ~ ^/(admin|login|auth|logout) {
        return 403;
    }
    location /api/v1/admin {
        return 403;
    }

    # 系統 API
    location /api/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        limit_req zone=key_api burst=40 nodelay;
        proxy_pass http://central_key_backend;
        include /etc/nginx/snippets/central-key-headers.conf;
    }

    # 健康檢查不對外
    location = /healthz {
        allow 127.0.0.1;
        deny  all;
        proxy_pass http://central_key_backend;
    }

    location / {
        return 404;
    }
}
