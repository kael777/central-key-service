# /etc/nginx/conf.d/central-key.conf
#
# 前置條件：
#   - nginx >= 1.11.6（需要 $ssl_client_s_dn_cn）
#   - 後端以 -trusted-proxy 127.0.0.1/32 -proxy-secret <密鑰> 啟動
#   - 系統用戶端憑證由同一組內網 CA 簽發

upstream central_key_backend {
    server 127.0.0.1:8443;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=key_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=key_api:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;                      # nginx < 1.25 請改用：listen 443 ssl http2;
    server_name key.internal;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # 系統端 mTLS；瀏覽器後台沒有憑證，所以用 optional
    ssl_client_certificate /etc/nginx/tls/ca.crt;
    ssl_verify_client      optional;
    ssl_verify_depth       2;

    server_tokens off;
    client_max_body_size 256k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 後台與管理 API：只允許維運網段
    location ~ ^/(admin|login|auth|api/v1/admin) {
        allow 10.20.0.0/16;        # 改成你的維運網段
        allow 127.0.0.1;
        deny  all;

        limit_req zone=key_login burst=10 nodelay;
        proxy_pass http://central_key_backend;
        include /etc/nginx/snippets/central-key-headers.conf;
    }

    # 系統 API：必須帶有效用戶端憑證
    location /api/ {
        if ($ssl_client_verify != SUCCESS) {
            return 403;
        }
        limit_req zone=key_api burst=60 nodelay;
        proxy_pass http://central_key_backend;
        include /etc/nginx/snippets/central-key-headers.conf;
    }

    # 健康檢查只給本機與維運網段
    location = /healthz {
        allow 127.0.0.1;
        allow 10.20.0.0/16;
        deny  all;
        proxy_pass http://central_key_backend;
        include /etc/nginx/snippets/central-key-headers.conf;
    }

    location / {
        return 404;
    }
}
