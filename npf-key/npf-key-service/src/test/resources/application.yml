server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:npfkey;MODE=MySQL;DB_CLOSE_DELAY=0;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

npf:
  refresh-seconds: 3600
  kms:
    mode: local
    local-key: test-local-key
  rotate:
    cron: "0 0 10 * * *"
    zone: Asia/Shanghai
    min-interval-hours: 4
  keys:
    hmac:
      - name: relay.callback
        remark: test callback
      - name: relay.daifu.sign
        remark: test daifu
  clients:
    - id: npf-payment
      ips:
        - 127.0.0.1
      allowed-keys:
        - relay.callback
        - relay.daifu.sign
    - id: other-client
      ips:
        - 10.9.9.9
      allowed-keys:
        - relay.callback

logging:
  level:
    root: WARN
    com.sp.npf.key: INFO
